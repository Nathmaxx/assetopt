name: Release

# Publishes both packages to npm when a version tag (e.g. v1.0.0) is pushed.
# Re-runs the full CI gate on the tagged commit, verifies the tag matches the
# package versions, then publishes in the only safe order: core, then cli.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci

      # Same gate as CI, re-run on the exact tagged commit.
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:run
      - run: npm run build

      # Abort before publishing if the tag, the package versions, or the
      # cli → core dependency range disagree.
      - name: Verify release invariants
        run: npm run release:check
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}

      # Order matters: cli depends on core, so core must exist on the registry
      # first or the CLI install would fail.
      - name: Publish @assetopt/core
        run: npm publish --workspace @assetopt/core --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @assetopt/cli
        run: npm publish --workspace @assetopt/cli --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
